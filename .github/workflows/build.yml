name: Build BetterThanHerobrine JAR
on:
  push:
    branches: [main, 'haunting-*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - name: Install audio validation tools
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Check director behavior and resource integrity
        run: |
          chmod +x gradlew tools/test-core.sh
          ./tools/test-core.sh
          python3 tools/check-assets.py
      - name: Clean build including director tests
        run: ./gradlew clean build --no-daemon --stacktrace
      - name: Upload compiled mod only after successful checks
        uses: actions/upload-artifact@v4
        with:
          name: BetterThanHerobrine-JAR-${{ github.sha }}
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar
          if-no-files-found: error
      - name: Preserve Gradle diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-diagnostics
          path: build/reports/
          if-no-files-found: ignore
