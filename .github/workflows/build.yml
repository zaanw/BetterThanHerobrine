name: Build BetterThanHerobrine JAR

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build.yml'
      - 'src/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
      - 'gradle/**'
      - 'gradlew'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Make Gradle executable
        run: chmod +x gradlew
      - name: Build mod
        run: ./gradlew build --stacktrace
      - name: Upload mod jar
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: BetterThanHerobrine-JAR
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar
          if-no-files-found: error
