name: Publish BetterThanHerobrine to Modrinth

on:
  workflow_dispatch:
    inputs:
      reviewed_version:
        description: 'Type the exact tested version to authorize publication'
        required: true
        type: string
      game_smoke_test_passed:
        description: 'Client rendering, F8, commands and dedicated server smoke tests have passed'
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: modrinth-release
    timeout-minutes: 30
    steps:
      - name: Check publication configuration
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          MODRINTH_PROJECT_ID: ${{ vars.MODRINTH_PROJECT_ID }}
        run: |
          if [ -z "$MODRINTH_TOKEN" ]; then
            echo "::error::Set the repository Actions secret MODRINTH_TOKEN (with CREATE_VERSION scope) before publishing."
            exit 1
          fi
          if [ -z "$MODRINTH_PROJECT_ID" ]; then
            echo "::error::Set the repository Actions variable MODRINTH_PROJECT_ID to your existing Modrinth project ID."
            exit 1
          fi
      - name: Checkout sources
        uses: actions/checkout@v4
      - name: Require an explicitly reviewed, tested version
        env:
          REVIEWED_VERSION: ${{ inputs.reviewed_version }}
          GAME_VERIFIED: ${{ inputs.game_smoke_test_passed }}
        run: |
          version=$(sed -n 's/^version=//p' gradle.properties | tr -d '\r')
          test "$REVIEWED_VERSION" = "$version"
          test "$GAME_VERIFIED" = "true"
      - name: Install Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Install audio validation tools
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Build and run checks
        run: |
          chmod +x gradlew
          ./tools/test-core.sh
          python3 tools/check-assets.py
          ./gradlew clean build
      - name: Prepare release JAR
        run: |
          mkdir -p dist
          find build/libs -maxdepth 1 -name '*.jar' ! -name '*-sources.jar' -type f -print
          count=$(find build/libs -maxdepth 1 -name '*.jar' ! -name '*-sources.jar' -type f | wc -l)
          if [ "$count" -ne 1 ]; then
            echo "::error::Expected exactly one release JAR, got $count."
            exit 1
          fi
          find build/libs -maxdepth 1 -name '*.jar' ! -name '*-sources.jar' -type f -exec cp '{}' dist/BetterThanHerobrine.jar \;
      - name: Read mod version
        id: mod_version
        shell: bash
        run: |
          version=$(sed -n 's/^version=//p' gradle.properties | head -n 1 | tr -d '\r')
          if [ -z "$version" ]; then
            echo "::error::Missing version in gradle.properties"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Publish on Modrinth
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          modrinth-id: ${{ vars.MODRINTH_PROJECT_ID }}
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          files: dist/BetterThanHerobrine.jar
          name: BetterThanHerobrine ${{ steps.mod_version.outputs.version }} (Minecraft 26.3)
          version: ${{ steps.mod_version.outputs.version }}
          version-type: beta
          changelog-file: docs/MODRINTH.md
          loaders: fabric
          game-versions: 26.3
          game-version-filter: none
          dependencies: |
            fabric-api(required){modrinth:P7dR8mSH}
