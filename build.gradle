plugins { id 'net.fabricmc.fabric-loom' version "${loom_version}" }
repositories { mavenCentral() }
loom {
 splitEnvironmentSourceSets()
 mods { betterthanherobrine { sourceSet sourceSets.main; sourceSet sourceSets.client } }
}
dependencies {
 minecraft "com.mojang:minecraft:${minecraft_version}"
 implementation "net.fabricmc:fabric-loader:${loader_version}"
 implementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"
}
java { sourceCompatibility = JavaVersion.VERSION_25; targetCompatibility = JavaVersion.VERSION_25; withSourcesJar() }
tasks.withType(JavaCompile).configureEach { options.release = 25 }
processResources { inputs.property 'version', project.version; filesMatching('fabric.mod.json') { expand 'version': project.version } }
tasks.register('directorTest', JavaExec) {
 dependsOn testClasses
 classpath = sourceSets.test.runtimeClasspath
 mainClass = 'com.betterthanherobrine.DirectorTest'
 enableAssertions = true
}
check.dependsOn directorTest

// The project uses the standalone directorTest JavaExec verification rather than JUnit tests.
tasks.named('test', Test) { failOnNoDiscoveredTests = false }
